<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.Mart Scenario Workbench</title>
<style>
/* ---------------------------------------------------------------------------
   One workbench serving all eight scenarios, driven by the VIEWS config below.
   Self-contained on purpose: no external script, font or stylesheet, so it
   renders where the SAPUI5 CDN is unreachable. The SAP Fiori elements apps in
   the sibling folders cover the same entities with standard SAP tooling when a
   UI5 runtime is available.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d; --text-primary: #fff;
    --text-secondary: #c3c2b7; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,.10); --series-1: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0d0d0d; --text-primary: #fff;
  --text-secondary: #c3c2b7; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,.10); --series-1: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font-family: var(--font); font-size: 14px; }

header.shell {
  background: var(--surface-1); border-bottom: 1px solid var(--border);
  padding: 12px 22px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; position: sticky; top: 0; z-index: 30;
}
.brand { margin-right: auto; display: flex; align-items: baseline; gap: 10px; }
.brand a { color: var(--series-1); text-decoration: none; font-size: 13px; }
.brand a:hover { text-decoration: underline; }
.brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
select, button, input {
  font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--axis); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
input { cursor: text; min-width: 190px; }
button:hover, select:hover { border-color: var(--series-1); }
button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }

nav.views {
  background: var(--surface-1); border-bottom: 1px solid var(--border);
  padding: 0 22px; display: flex; gap: 2px; overflow-x: auto; position: sticky; top: 53px; z-index: 25;
}
nav.views a {
  padding: 10px 14px; font-size: 13px; color: var(--text-secondary); text-decoration: none;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.views a:hover { color: var(--text-primary); }
nav.views a.active { color: var(--series-1); border-bottom-color: var(--series-1); font-weight: 600; }

main { padding: 18px 22px 60px; max-width: 1600px; margin: 0 auto; }
.title-row { margin-bottom: 14px; }
.title-row h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
.title-row p { margin: 0; color: var(--text-secondary); font-size: 13.5px; max-width: 95ch; }

.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 16px; }
.kpi {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 16px; min-width: 150px;
}
.kpi .k-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
.kpi .k-value { font-size: 22px; font-weight: 600; margin-top: 2px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .spacer { margin-left: auto; color: var(--text-muted); font-size: 12.5px; }

.panel {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.table-wrap { overflow-x: auto; max-height: 66vh; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th {
  color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .03em; position: sticky; top: 0; background: var(--surface-1); z-index: 2; cursor: pointer;
  user-select: none;
}
th:hover { color: var(--series-1); }
th .arrow { opacity: .5; font-size: 10px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 260px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--series-1) 7%, transparent); }
tbody tr.sel { background: color-mix(in srgb, var(--series-1) 12%, transparent); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.CRITICAL { color: var(--status-critical); border-color: color-mix(in srgb, var(--status-critical) 40%, transparent); background: color-mix(in srgb, var(--status-critical) 10%, transparent); }
.pill.HIGH { color: var(--status-serious); border-color: color-mix(in srgb, var(--status-serious) 40%, transparent); background: color-mix(in srgb, var(--status-serious) 10%, transparent); }
.pill.MEDIUM { color: var(--status-warning); border-color: color-mix(in srgb, var(--status-warning) 45%, transparent); background: color-mix(in srgb, var(--status-warning) 12%, transparent); }
.pill.LOW { color: var(--status-good); border-color: color-mix(in srgb, var(--status-good) 40%, transparent); background: color-mix(in srgb, var(--status-good) 10%, transparent); }
.pill.OPEN { color: var(--series-1); border-color: color-mix(in srgb, var(--series-1) 40%, transparent); background: color-mix(in srgb, var(--series-1) 10%, transparent); }
.pill.ACKNOWLEDGED { color: var(--status-warning); border-color: color-mix(in srgb, var(--status-warning) 45%, transparent); background: color-mix(in srgb, var(--status-warning) 12%, transparent); }
.pill.RESOLVED { color: var(--status-good); border-color: color-mix(in srgb, var(--status-good) 40%, transparent); background: color-mix(in srgb, var(--status-good) 10%, transparent); }
.pill.DISMISSED { color: var(--text-muted); border-color: var(--grid); background: color-mix(in srgb, var(--text-muted) 10%, transparent); }

/* Detail drawer */
.drawer {
  position: fixed; top: 0; right: 0; width: min(520px, 100%); height: 100%;
  background: var(--surface-1); border-left: 1px solid var(--border);
  box-shadow: -8px 0 26px rgba(0,0,0,.14); transform: translateX(100%);
  transition: transform .18s ease; z-index: 60; display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer header h3 { margin: 0; font-size: 15.5px; font-weight: 600; flex: 1; }
.drawer .close { border: none; background: none; font-size: 20px; line-height: 1; padding: 0 4px; color: var(--text-secondary); }
.drawer .body { padding: 16px 18px; overflow-y: auto; flex: 1; }
.drawer .actions { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.field { margin-bottom: 12px; }
.field .f-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); margin-bottom: 3px; }
.field .f-value { font-size: 13.5px; word-break: break-word; }
.field.prose .f-value { line-height: 1.55; }

.empty, .err, .loading { padding: 26px; text-align: center; color: var(--text-secondary); font-size: 13.5px; }
.err { color: var(--text-primary); background: color-mix(in srgb, var(--status-critical) 8%, transparent); }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--surface-1); border: 1px solid var(--axis); border-radius: 8px;
  padding: 10px 16px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 80;
}
.toast.on { opacity: 1; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="shell">
  <div class="brand">
    <h1>Scenario Workbench</h1>
    <a href="/index.html">&larr; Launchpad</a>
    <a href="/command-center/index.html">Command Centre</a>
  </div>
  <label class="visually-hidden" for="storeFilter">Store</label>
  <select id="storeFilter"><option value="">All stores</option></select>
  <label class="visually-hidden" for="stateFilter">Status</label>
  <select id="stateFilter">
    <option value="OPEN">Open only</option>
    <option value="">Any status</option>
    <option value="ACKNOWLEDGED">Acknowledged</option>
    <option value="RESOLVED">Resolved</option>
    <option value="DISMISSED">Dismissed</option>
  </select>
  <label class="visually-hidden" for="search">Search</label>
  <input id="search" type="search" placeholder="Filter rows…" autocomplete="off">
  <button id="themeToggle" title="Switch light and dark">Dark</button>
  <button id="reload" class="primary">Reload</button>
</header>

<nav class="views" id="viewNav"></nav>

<main>
  <div class="title-row">
    <h2 id="viewTitle">…</h2>
    <p id="viewDesc"></p>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <span class="spacer" id="rowCount"></span>
  </div>
  <div class="panel">
    <div class="table-wrap"><div id="tableHost"><div class="loading">Loading…</div></div></div>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <h3 id="drawerTitle">Detail</h3>
    <button class="close" id="drawerClose" aria-label="Close">&times;</button>
  </header>
  <div class="body" id="drawerBody"></div>
  <div class="actions" id="drawerActions"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const AI = '/ai';

/* ---------------------------------------------------------------------------
   Formatting
--------------------------------------------------------------------------- */
const euro = (v) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(v) || 0);
const euro0 = (v) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(v) || 0);
const num = (v, d = 0) => new Intl.NumberFormat('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d }).format(Number(v) || 0);
const pct = (v) => `${num(Number(v) * 100, 1)}%`;
const pctRaw = (v) => `${num(v, 1)}%`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const titleCase = (s) => String(s || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
const dt = (v) => (v ? String(v).replace('T', ' ').replace(/Z$/, '').slice(0, 16) : '—');
const dateOnly = (v) => (v ? String(v).slice(0, 10) : '—');

const FORMATTERS = {
  text: (v) => esc(v ?? '—'),
  wrap: (v) => esc(v ?? '—'),
  euro: (v) => euro(v),
  euro0: (v) => euro0(v),
  int: (v) => num(v),
  dec1: (v) => num(v, 1),
  dec2: (v) => num(v, 2),
  dec3: (v) => num(v, 3),
  ratio: (v) => pct(v),
  percent: (v) => pctRaw(v),
  date: (v) => dateOnly(v),
  datetime: (v) => dt(v),
  pattern: (v) => esc(titleCase(v)),
  pill: (v) => (v ? `<span class="pill ${esc(v)}">${esc(v)}</span>` : '—'),
  bool: (v) => (v === true || v === 'true' ? 'Yes' : 'No'),
};

const NUMERIC = new Set(['euro', 'euro0', 'int', 'dec1', 'dec2', 'dec3', 'ratio', 'percent']);

/* ---------------------------------------------------------------------------
   View configuration — one entry per scenario.

   `expand` pulls the display names off the associations so the table shows
   "Red Bull 0,25" rather than "AR90013". `state` marks views that carry the
   OPEN/ACKNOWLEDGED/RESOLVED/DISMISSED lifecycle, which drives the status
   filter and the action buttons.
--------------------------------------------------------------------------- */
const VIEWS = {
  'checkout-integrity': {
    label: 'Checkout Integrity',
    entity: 'ShrinkAlerts',
    title: 'Checkout Integrity Radar',
    desc: 'RFID misreads, absent tags, stock variance and price errors on the autonomous terminals. '
        + 'Each alert carries the evidence behind it and the article\'s own baseline it was compared against.',
    expand: 'store($select=name),article($select=name),posSystem($select=name,kind)',
    sort: 'anomalyScore desc',
    state: true,
    kpis: [
      { label: 'Alerts', calc: (r) => num(r.length) },
      { label: 'Value at risk', calc: (r) => euro(r.reduce((s, x) => s + Number(x.valueAtRisk || 0), 0)) },
      { label: 'Critical or high', calc: (r) => num(r.filter((x) => x.severity === 'CRITICAL' || x.severity === 'HIGH').length) },
    ],
    columns: [
      { key: 'severity', label: 'Severity', fmt: 'pill' },
      { key: 'pattern', label: 'Pattern', fmt: 'pattern' },
      { key: 'article.name', label: 'Article', fmt: 'text' },
      { key: 'store.name', label: 'Store', fmt: 'text' },
      { key: 'posSystem.name', label: 'Terminal', fmt: 'text' },
      { key: 'anomalyScore', label: 'Score', fmt: 'dec1' },
      { key: 'valueAtRisk', label: 'At risk', fmt: 'euro' },
      { key: 'cancellationRate', label: 'Cancel rate', fmt: 'ratio' },
      { key: 'baselineRate', label: 'Baseline', fmt: 'ratio' },
      { key: 'state', label: 'Status', fmt: 'pill' },
      { key: 'detectedOn', label: 'Detected', fmt: 'date' },
    ],
    detail: ['pattern', 'severity', 'anomalyScore', 'cancellationRate', 'baselineRate', 'valueAtRisk',
      'store.name', 'posSystem.name', 'posSystem.kind', 'article.name', 'detectedOn', 'state'],
    prose: ['evidence', 'recommendedAction'],
    actions: [
      { id: 'acknowledge', label: 'Acknowledge', arg: 'note', value: 'Reviewed in the scenario workbench' },
      { id: 'resolveAlert', label: 'Resolve', arg: 'resolution', value: 'Resolved in the scenario workbench' },
      { id: 'dismiss', label: 'Dismiss', arg: 'reason', value: 'Not actionable' },
    ],
  },

  'replenishment': {
    label: 'Replenishment',
    entity: 'ReplenishmentTasks',
    title: 'Replenishment Cockpit',
    desc: 'Reorder proposals sized from forecast demand over the supplier lead time plus safety stock. '
        + 'Urgency follows coverage in trading hours, not order size.',
    expand: 'store($select=name),article($select=name),supplier($select=name,leadTimeDays,reliability)',
    sort: 'lostSalesValue desc',
    state: true,
    kpis: [
      { label: 'Open tasks', calc: (r) => num(r.length) },
      { label: 'Lost sales exposure', calc: (r) => euro(r.reduce((s, x) => s + Number(x.lostSalesValue || 0), 0)) },
      { label: 'Units to order', calc: (r) => num(r.reduce((s, x) => s + Number(x.recommendedQty || 0), 0)) },
    ],
    columns: [
      { key: 'urgency', label: 'Urgency', fmt: 'pill' },
      { key: 'article.name', label: 'Article', fmt: 'text' },
      { key: 'store.name', label: 'Store', fmt: 'text' },
      { key: 'onHand', label: 'On hand', fmt: 'dec1' },
      { key: 'coverageHours', label: 'Cover (h)', fmt: 'dec1' },
      { key: 'recommendedQty', label: 'Order', fmt: 'int' },
      { key: 'stockoutRisk', label: 'Stockout risk', fmt: 'ratio' },
      { key: 'lostSalesValue', label: 'Lost sales', fmt: 'euro' },
      { key: 'supplier.name', label: 'Supplier', fmt: 'text' },
      { key: 'state', label: 'Status', fmt: 'pill' },
    ],
    detail: ['urgency', 'onHand', 'reorderPoint', 'recommendedQty', 'coverageHours', 'stockoutRisk',
      'lostSalesValue', 'store.name', 'article.name', 'supplier.name', 'supplier.leadTimeDays',
      'supplier.reliability', 'dueOn', 'state'],
    prose: ['reasoning'],
    actions: [
      { id: 'releaseOrder', label: 'Release order', arg: 'quantity', fromField: 'recommendedQty' },
      { id: 'dismiss', label: 'Dismiss', arg: 'reason', value: 'Not required' },
    ],
  },

  'fresh-waste': {
    label: 'Fresh Waste',
    entity: 'MarkdownRecommendations',
    title: 'Fresh Waste Guard',
    desc: 'Markdown depth chosen by sweeping candidate discounts and keeping the one that recovers the most '
        + 'margin before expiry. A proposal only appears when it beats doing nothing.',
    expand: 'store($select=name),article($select=name)',
    sort: 'marginImpact desc',
    state: true,
    kpis: [
      { label: 'Recommendations', calc: (r) => num(r.length) },
      { label: 'Margin protected', calc: (r) => euro(r.reduce((s, x) => s + Number(x.marginImpact || 0), 0)) },
      { label: 'Units at risk', calc: (r) => num(r.reduce((s, x) => s + Number(x.projectedWaste || 0), 0), 1) },
    ],
    columns: [
      { key: 'article.name', label: 'Article', fmt: 'text' },
      { key: 'store.name', label: 'Store', fmt: 'text' },
      { key: 'onHand', label: 'On hand', fmt: 'dec1' },
      { key: 'forecastSellThrough', label: 'Will sell', fmt: 'dec1' },
      { key: 'projectedWaste', label: 'At risk', fmt: 'dec1' },
      { key: 'recommendedDiscountPct', label: 'Markdown', fmt: 'percent' },
      { key: 'expectedRecovery', label: 'Recovery', fmt: 'euro' },
      { key: 'marginImpact', label: 'Margin impact', fmt: 'euro' },
      { key: 'hoursToExpiry', label: 'Hours left', fmt: 'dec1' },
      { key: 'state', label: 'Status', fmt: 'pill' },
    ],
    detail: ['store.name', 'article.name', 'onHand', 'forecastSellThrough', 'projectedWaste',
      'recommendedDiscountPct', 'expectedRecovery', 'wasteCostAvoided', 'marginImpact',
      'hoursToExpiry', 'expiresOn', 'businessDate', 'state'],
    prose: ['reasoning'],
    actions: [
      { id: 'applyMarkdown', label: 'Apply markdown', arg: 'discountPct', fromField: 'recommendedDiscountPct' },
      { id: 'dismiss', label: 'Dismiss', arg: 'reason', value: 'Handled at the shelf' },
    ],
  },

  'demand-forecast': {
    label: 'Demand Forecast',
    entity: 'DemandForecasts',
    title: 'Demand Forecast',
    desc: 'Hourly forecast per store and article with an 80% prediction interval. Accuracy is reported as '
        + 'WAPE because hourly demand is intermittent and MAPE divides by actuals of one or two units.',
    expand: 'store($select=name),article($select=name)',
    sort: 'forecastFor asc',
    state: false,
    kpis: [
      { label: 'Forecast rows', calc: (r) => num(r.length) },
      { label: 'Predicted units', calc: (r) => num(r.reduce((s, x) => s + Number(x.predictedQty || 0), 0), 1) },
      { label: 'Articles covered', calc: (r) => num(new Set(r.map((x) => x.article_ID)).size) },
    ],
    columns: [
      { key: 'forecastFor', label: 'Hour', fmt: 'datetime' },
      { key: 'article.name', label: 'Article', fmt: 'text' },
      { key: 'store.name', label: 'Store', fmt: 'text' },
      { key: 'predictedQty', label: 'Forecast', fmt: 'dec3' },
      { key: 'lowerBound', label: 'Low', fmt: 'dec3' },
      { key: 'upperBound', label: 'High', fmt: 'dec3' },
      { key: 'wape', label: 'WAPE', fmt: 'percent' },
      { key: 'model', label: 'Model', fmt: 'text' },
    ],
    detail: ['store.name', 'article.name', 'forecastFor', 'businessDate', 'hourOfDay',
      'predictedQty', 'lowerBound', 'upperBound', 'wape', 'mape', 'model', 'generatedAt'],
    prose: [],
    actions: [],
  },

  'basket-affinity': {
    label: 'Basket Affinity',
    entity: 'BasketAffinities',
    title: 'Basket Affinity & Planogram',
    desc: 'Association rules mined from receipt baskets. Lift above 1 means the pair sells together more often '
        + 'than chance. Cross-zone pairs are the placement opportunities.',
    expand: 'store($select=name),antecedent($select=name),consequent($select=name)',
    sort: 'lift desc',
    state: false,
    kpis: [
      { label: 'Rules', calc: (r) => num(r.length) },
      { label: 'Cross-zone', calc: (r) => num(r.filter((x) => x.isCrossZone === true).length) },
      { label: 'Best lift', calc: (r) => num(Math.max(0, ...r.map((x) => Number(x.lift || 0))), 2) },
    ],
    columns: [
      { key: 'antecedent.name', label: 'If basket has', fmt: 'text' },
      { key: 'consequent.name', label: 'Also buys', fmt: 'text' },
      { key: 'store.name', label: 'Store', fmt: 'text' },
      { key: 'lift', label: 'Lift', fmt: 'dec2' },
      { key: 'confidence', label: 'Confidence', fmt: 'ratio' },
      { key: 'support', label: 'Support', fmt: 'ratio' },
      { key: 'basketCount', label: 'Baskets', fmt: 'int' },
      { key: 'upliftPerBasket', label: 'Uplift/basket', fmt: 'euro' },
      { key: 'isCrossZone', label: 'Cross zone', fmt: 'bool' },
    ],
    detail: ['store.name', 'antecedent.name', 'consequent.name', 'lift', 'confidence', 'support',
      'basketCount', 'upliftPerBasket', 'isCrossZone'],
    prose: ['recommendedPlacement'],
    actions: [],
  },

  'personal-offers': {
    label: 'Personal Offers',
    entity: 'NextBestOffers',
    title: 'Personalised Offers',
    desc: 'Next best offer per S.Mart app customer, from purchase cadence and basket affinity. '
        + 'Only customers who granted marketing consent are ever included.',
    expand: 'store($select=name),article($select=name),customer($select=displayName,loyaltyTier,segment)',
    sort: 'propensity desc',
    state: true,
    kpis: [
      { label: 'Offers', calc: (r) => num(r.length) },
      { label: 'Expected revenue', calc: (r) => euro(r.reduce((s, x) => s + Number(x.expectedRevenue || 0), 0)) },
      { label: 'Customers', calc: (r) => num(new Set(r.map((x) => x.customer_ID)).size) },
    ],
    columns: [
      { key: 'customer.displayName', label: 'Customer', fmt: 'text' },
      { key: 'customer.loyaltyTier', label: 'Tier', fmt: 'text' },
      { key: 'article.name', label: 'Offer', fmt: 'text' },

/* ---------------------------------------------------------------------------
   State
--------------------------------------------------------------------------- */
const state = {
  view: null, rows: [], stores: [], store: '', status: 'OPEN',
  search: '', sortKey: null, sortDir: 'asc', selected: null,
};

/** Read a possibly nested key such as "article.name" off a row. */
const pick = (row, key) => key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), row);

const toast = (message) => {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2600);
};

/* ---------------------------------------------------------------------------
   Data
--------------------------------------------------------------------------- */
async function odata(path, options = {}) {
  const response = await fetch(path, {
    credentials: 'include',
    headers: { Accept: 'application/json', ...(options.headers || {}) },
    method: options.method || 'GET',
    body: options.body,
  });
  if (!response.ok) {
    let detail = `${response.status} ${response.statusText}`;
    try {
      const payload = await response.json();
      if (payload?.error?.message) detail = payload.error.message;
    } catch { /* response was not JSON */ }
    const error = new Error(detail);
    error.status = response.status;
    throw error;
  }
  if (response.status === 204) return null;
  const payload = await response.json();
  return payload.value !== undefined ? payload.value : payload;
}

const escapeOData = (v) => String(v).replace(/'/g, "''");

async function loadStores() {
  if (state.stores.length) return;
  state.stores = await odata(`${AI}/Stores?$top=50&$select=ID,name,isReferenceStore&$orderby=name`);
  const select = document.getElementById('storeFilter');
  for (const store of state.stores) {
    const option = document.createElement('option');
    option.value = store.ID;
    option.textContent = store.isReferenceStore ? `${store.name} (SAP export)` : store.name;
    select.appendChild(option);
  }
  select.value = state.store;
}

async function loadRows() {
  const view = VIEWS[state.view];
  const host = document.getElementById('tableHost');
  host.innerHTML = '<div class="loading">Loading…</div>';

  const filters = [];
  if (state.store) filters.push(`store_ID eq '${escapeOData(state.store)}'`);
  if (view.state && state.status) filters.push(`state eq '${escapeOData(state.status)}'`);

  const query = [
    '$top=500',
    `$expand=${view.expand}`,
    `$orderby=${view.sort}`,
    filters.length ? `$filter=${filters.join(' and ')}` : null,
  ].filter(Boolean).join('&');

  try {
    state.rows = await odata(`${AI}/${view.entity}?${query}`);
    renderKpis();
    renderTable();
  } catch (error) {
    host.innerHTML = `<div class="err"><strong>Could not load ${esc(view.entity)}.</strong><br>${esc(error.message)}`
      + `${error.status === 401 ? '<br>Sign in as manager / manager and reload.' : ''}</div>`;
    document.getElementById('kpis').innerHTML = '';
    document.getElementById('rowCount').textContent = '';
  }
}

/* ---------------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------------- */
function visibleRows() {
  const term = state.search.trim().toLowerCase();
  let rows = state.rows;
  if (term) {
    const view = VIEWS[state.view];
    const keys = view.columns.map((c) => c.key);
    rows = rows.filter((row) => keys.some((k) => String(pick(row, k) ?? '').toLowerCase().includes(term)));
  }
  if (state.sortKey) {
    const dir = state.sortDir === 'asc' ? 1 : -1;
    rows = [...rows].sort((a, b) => {
      const av = pick(a, state.sortKey);
      const bv = pick(b, state.sortKey);
      const an = Number(av);
      const bn = Number(bv);
      if (Number.isFinite(an) && Number.isFinite(bn) && av !== '' && bv !== '') return (an - bn) * dir;
      return String(av ?? '').localeCompare(String(bv ?? '')) * dir;
    });
  }
  return rows;
}

function renderKpis() {
  const view = VIEWS[state.view];
  document.getElementById('kpis').innerHTML = view.kpis.map((k) => `
    <div class="kpi"><div class="k-label">${esc(k.label)}</div><div class="k-value">${k.calc(state.rows)}</div></div>
  `).join('');
}

function renderTable() {
  const view = VIEWS[state.view];
  const rows = visibleRows();
  const host = document.getElementById('tableHost');

  document.getElementById('rowCount').textContent =
    `${rows.length} of ${state.rows.length} row${state.rows.length === 1 ? '' : 's'}`;

  if (!rows.length) {
    host.innerHTML = `<div class="empty">Nothing matches the current filters.${
      state.status ? ' Try setting status to “Any status”.' : ''}</div>`;
    return;
  }

  const head = view.columns.map((c) => {
    const active = state.sortKey === c.key;
    const arrow = active ? `<span class="arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th data-key="${esc(c.key)}" class="${NUMERIC.has(c.fmt) ? 'num' : ''}">${esc(c.label)} ${arrow}</th>`;
  }).join('');

  const body = rows.map((row, index) => {
    const cells = view.columns.map((c) => {
      const raw = pick(row, c.key);
      const formatted = (FORMATTERS[c.fmt] || FORMATTERS.text)(raw);
      const cls = [NUMERIC.has(c.fmt) ? 'num' : '', c.fmt === 'wrap' ? 'wrap' : ''].filter(Boolean).join(' ');
      return `<td class="${cls}">${formatted}</td>`;
    }).join('');
    return `<tr data-index="${index}">${cells}</tr>`;
  }).join('');

  host.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

  host.querySelectorAll('th').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'asc'; }
      renderTable();
    });
  });
  host.querySelectorAll('tbody tr').forEach((tr) => {
    tr.addEventListener('click', () => openDrawer(rows[Number(tr.dataset.index)], tr));
  });
}

const LABELS = {
  'store.name': 'Store', 'article.name': 'Article', 'posSystem.name': 'Terminal',
  'posSystem.kind': 'Terminal type', 'supplier.name': 'Supplier',
  'supplier.leadTimeDays': 'Lead time (days)', 'supplier.reliability': 'Supplier reliability',
  'antecedent.name': 'If basket has', 'consequent.name': 'Also buys',
  'customer.displayName': 'Customer', 'customer.loyaltyTier': 'Loyalty tier',
  'customer.segment': 'Segment',
};

const labelFor = (key) => LABELS[key]
  || key.replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase()).replace(/Pct$/, ' %').trim();

function formatDetail(view, key, value) {
  const column = view.columns.find((c) => c.key === key);
  if (column) return (FORMATTERS[column.fmt] || FORMATTERS.text)(value);
  if (typeof value === 'boolean') return FORMATTERS.bool(value);
  if (/At$|On$|From$|To$/.test(key) && typeof value === 'string' && value.includes('-')) {
    return value.includes('T') ? dt(value) : dateOnly(value);
  }
  if (typeof value === 'number') return num(value, Number.isInteger(value) ? 0 : 3);
  return esc(value ?? '—');
}

function openDrawer(row, tr) {
  const view = VIEWS[state.view];
  state.selected = row;

  document.querySelectorAll('tbody tr.sel').forEach((el) => el.classList.remove('sel'));
  if (tr) tr.classList.add('sel');

  const heading = pick(row, 'article.name') || pick(row, 'assetName') || row.title
    || pick(row, 'antecedent.name') || pick(row, 'customer.displayName') || row.ID;
  document.getElementById('drawerTitle').textContent = heading;

  const fields = view.detail.map((key) => `
    <div class="field">
      <div class="f-label">${esc(labelFor(key))}</div>
      <div class="f-value">${formatDetail(view, key, pick(row, key))}</div>
    </div>`).join('');

  const prose = view.prose.filter((key) => row[key]).map((key) => `
    <div class="field prose">
      <div class="f-label">${esc(labelFor(key))}</div>
      <div class="f-value">${esc(row[key])}</div>
    </div>`).join('');

  document.getElementById('drawerBody').innerHTML = prose + fields
    + `<div class="field"><div class="f-label">Record</div><div class="f-value">${esc(row.ID)}</div></div>`;

  // Actions only make sense while the record is still open.
  const canAct = !view.state || row.state === 'OPEN';
  document.getElementById('drawerActions').innerHTML = canAct
    ? view.actions.map((a) => `<button data-action="${esc(a.id)}">${esc(a.label)}</button>`).join('')
    : (view.actions.length ? `<span class="f-label">Already ${esc(String(row.state).toLowerCase())}</span>` : '');

  document.getElementById('drawerActions').querySelectorAll('button').forEach((button) => {
    button.addEventListener('click', () => runAction(button.dataset.action, row, button));
  });

  const drawer = document.getElementById('drawer');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
}

function closeDrawer() {
  const drawer = document.getElementById('drawer');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  document.querySelectorAll('tbody tr.sel').forEach((el) => el.classList.remove('sel'));
}

async function runAction(actionId, row, button) {
  const view = VIEWS[state.view];
  const action = view.actions.find((a) => a.id === actionId);
  if (!action) return;

  const payload = {};
  if (action.arg) {
    payload[action.arg] = action.fromField ? Number(row[action.fromField]) : action.value;
  }

  button.disabled = true;
  const original = button.textContent;
  button.textContent = 'Working…';
  try {
    await odata(`${AI}/${view.entity}('${encodeURIComponent(row.ID)}')/AIService.${actionId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    toast(`${action.label} applied to ${row.ID}.`);
    closeDrawer();
    await loadRows();
  } catch (error) {
    toast(`Failed: ${error.message}`);
    button.disabled = false;
    button.textContent = original;
  }
}

/* ---------------------------------------------------------------------------
   Navigation and controls
--------------------------------------------------------------------------- */
function renderNav() {
  document.getElementById('viewNav').innerHTML = Object.entries(VIEWS).map(([key, view]) =>
    `<a href="?view=${key}" data-view="${key}" class="${key === state.view ? 'active' : ''}">${esc(view.label)}</a>`
  ).join('');

  document.getElementById('viewNav').querySelectorAll('a').forEach((a) => {
    a.addEventListener('click', (event) => {
      event.preventDefault();
      switchView(a.dataset.view);
    });
  });
}

function switchView(key) {
  state.view = VIEWS[key] ? key : Object.keys(VIEWS)[0];
  state.sortKey = null;
  state.search = '';
  document.getElementById('search').value = '';
  closeDrawer();

  const view = VIEWS[state.view];
  document.title = `${view.title} — S.Mart`;
  document.getElementById('viewTitle').textContent = view.title;
  document.getElementById('viewDesc').textContent = view.desc;
  // The status filter is meaningless on views without a lifecycle.
  document.getElementById('stateFilter').disabled = !view.state;

  history.replaceState(null, '', `?view=${state.view}`);
  renderNav();
  loadRows();
}

document.getElementById('storeFilter').addEventListener('change', (e) => { state.store = e.target.value; loadRows(); });
document.getElementById('stateFilter').addEventListener('change', (e) => { state.status = e.target.value; loadRows(); });
document.getElementById('search').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
document.getElementById('reload').addEventListener('click', () => loadRows());
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

document.getElementById('themeToggle').addEventListener('click', (e) => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? 'Dark' : 'Light';
});

(async function start() {
  const requested = new URLSearchParams(location.search).get('view');
  state.view = VIEWS[requested] ? requested : Object.keys(VIEWS)[0];
  renderNav();
  try {
    await loadStores();
  } catch (error) {
    // A failure here is almost always authentication; loadRows reports it.
  }
  switchView(state.view);
})();
</script>
