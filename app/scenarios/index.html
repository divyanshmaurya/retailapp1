<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Workbench — S.Mart Retail AI</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
/* Workbench specifics; everything else comes from the shared theme. */
.tabs {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 0 22px; display: flex; gap: 4px; overflow-x: auto;
  position: sticky; top: var(--header-h); z-index: 35;
}
.tabs a {
  padding: 11px 14px; font-size: 13px; font-weight: 500; color: var(--ink-2);
  text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent;
  transition: color .12s, border-color .12s;
}
.tabs a:hover { color: var(--ink); }
.tabs a.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 620; }
.tabs a .count {
  display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: var(--r-pill); background: var(--surface-sunk); color: var(--ink-3);
}
.tabs a.active .count { background: var(--brand-soft); color: var(--brand); }

.toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .spacer { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.grid-stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.panel .table-wrap { max-height: 66vh; overflow-y: auto; border-radius: 0; }
.pager {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-sunk);
}
.pager-label { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pager .btn[disabled] { opacity: .45; cursor: not-allowed; }
@media (max-width: 720px) { .tabs { top: auto; position: static; } }
</style>
</head>
<body>

<header id="appHeader"></header>
<nav class="tabs" id="tabs" aria-label="Scenarios"></nav>

<main class="app-main">
  <div class="page-head">
    <h1 id="viewTitle">…</h1>
    <p id="viewDesc"></p>
  </div>

  <div class="grid-stats" id="kpis"></div>

  <div class="toolbar">
    <label class="visually-hidden" for="storeFilter">Store</label>
    <select class="ctl" id="storeFilter"><option value="">All stores</option></select>
    <label class="visually-hidden" for="stateFilter">Status</label>
    <select class="ctl" id="stateFilter">
      <option value="OPEN">Open only</option>
      <option value="">Any status</option>
      <option value="ACKNOWLEDGED">Acknowledged</option>
      <option value="RESOLVED">Resolved</option>
      <option value="DISMISSED">Dismissed</option>
    </select>
    <label class="visually-hidden" for="search">Search</label>
    <input class="ctl" id="search" type="search" placeholder="Filter rows…" autocomplete="off">
    <button class="btn" id="reload">Reload</button>
    <span class="spacer" id="rowCount"></span>
  </div>

  <div class="panel"><div id="tableHost"></div></div>
</main>

<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Record detail">
  <div class="drawer-head">
    <h3 id="drawerTitle">Detail</h3>
    <button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-actions" id="drawerActions"></div>
</aside>

<script src="/assets/shell.js"></script>

/**
 * Rows per request.
 *
 * Filtering, ordering and searching all run on the service rather than in the
 * browser. The previous version pulled a flat $top=500 and did the work here,
 * which quietly lied twice over: collections larger than 500 rows were cut off
 * with no indication, and sorting a truncated page presented the top of the
 * page as the top of the data.
 */
const PAGE_SIZE = 100;

const state = {
  view: null, rows: [], stores: [], store: '', status: 'OPEN',
  search: '', sortKey: null, sortDir: 'asc', counts: {},
  page: 0, total: null, loading: false, searchTimer: null,
};

const pick = (row, key) => key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), row);
const dt = (v) => (v ? String(v).replace('T', ' ').replace(/Z$/, '').slice(0, 16) : '—');
const dateOnly = (v) => (v ? String(v).slice(0, 10) : '—');

const FMT = {
  text: (v) => Shell.esc(v ?? '—'),
  wrap: (v) => Shell.esc(v ?? '—'),
  title: (v) => Shell.esc(Shell.titleCase(v)),
  euro: (v) => Shell.euro(v),
  int: (v) => Shell.num(v),
  dec1: (v) => Shell.num(v, 1),
  dec2: (v) => Shell.num(v, 2),
  dec3: (v) => Shell.num(v, 3),
  ratio: (v) => Shell.pct(v),
  pctRaw: (v) => `${Shell.num(v, 1)}%`,
  date: (v) => dateOnly(v),
  datetime: (v) => dt(v),
  pill: (v) => (v ? `<span class="pill ${Shell.esc(v)}">${Shell.esc(v)}</span>` : '—'),
  bool: (v) => (v === true || v === 'true' ? 'Yes' : 'No'),
};
const NUMERIC = new Set(['euro', 'int', 'dec1', 'dec2', 'dec3', 'ratio', 'pctRaw']);

Shell.header('scenarios');

// --- data ------------------------------------------------------------------

async function loadStores() {
  if (state.stores.length) return;
  state.stores = await Shell.fetchJson(`${AI}/Stores?$top=50&$select=ID,name,isReferenceStore&$orderby=name`);
  const select = document.getElementById('storeFilter');
  for (const store of state.stores) {
    const option = document.createElement('option');
    option.value = store.ID;
    option.textContent = store.isReferenceStore ? `${store.name} (SAP export)` : store.name;
    select.appendChild(option);
  }
  select.value = state.store;
}

/**
 * Which columns a free-text search should look in.
 *
 * Only string columns: `contains()` is not defined over numbers or dates in
 * OData, and asking for it returns a 400 rather than simply matching nothing.
 */
const SEARCHABLE = new Set(['text', 'wrap', 'title', 'pill']);

function searchFilter(view, term) {
  // Lower-cased on both sides. Half these columns hold enum-style values in
  // upper case (GOLD, TAG_ABSENT) and the other half hold prose, so a
  // case-sensitive match would find whichever the user did not type.
  const needle = Shell.odata(term.trim().toLowerCase());
  if (!needle) return null;
  const clauses = view.columns
    .filter((c) => SEARCHABLE.has(c.fmt))
    // OData navigates with a slash; the table addresses the same field with a
    // dot because that is how it arrives in the expanded JSON.
    .map((c) => `contains(tolower(${c.key.replace(/\./g, '/')}),'${needle}')`);
  return clauses.length ? `(${clauses.join(' or ')})` : null;
}

/** The $orderby for the current sort, falling back to the view's own default. */
function orderBy(view) {
  if (!state.sortKey) return view.sort;
  return `${state.sortKey.replace(/\./g, '/')} ${state.sortDir}`;
}

async function loadRows() {
  const view = VIEWS[state.view];
  const host = document.getElementById('tableHost');
  state.loading = true;
  host.innerHTML = `<div style="padding:16px">${Array.from({ length: 8 }, () =>
    '<div class="skeleton skeleton-row"></div>').join('')}</div>`;

  const filters = [];
  if (state.store) filters.push(`store_ID eq '${Shell.odata(state.store)}'`);
  if (view.state && state.status) filters.push(`state eq '${Shell.odata(state.status)}'`);
  const search = searchFilter(view, state.search);
  if (search) filters.push(search);

  const query = [
    `$top=${PAGE_SIZE}`,
    `$skip=${state.page * PAGE_SIZE}`,
    // Ask for the total so the footer can say how many rows there are, not just
    // how many came back in this page.
    '$count=true',
    `$expand=${view.expand}`,
    `$orderby=${orderBy(view)}`,
    filters.length ? `$filter=${filters.join(' and ')}` : null,
  ].filter(Boolean).join('&');

  try {
    const { rows, total } = await Shell.fetchPage(`${AI}/${view.entity}?${query}`);
    state.rows = rows;
    state.total = total;
    // The tab badge should count the whole collection, not the page.
    state.counts[state.view] = total ?? rows.length;
    renderTabs();
    renderKpis();
    renderTable();
  } catch (error) {
    document.getElementById('kpis').innerHTML = '';
    document.getElementById('rowCount').textContent = '';
    host.innerHTML = Shell.isAuthError(error)
      ? Shell.authErrorHtml(error)
      : `<div class="state-error" style="margin:16px"><strong>Could not load ${Shell.esc(view.entity)}.</strong>`
        + `<code>${Shell.esc(error.message)}</code></div>`;
  } finally {
    state.loading = false;
  }
}

/** Move to a page and reload. Bounds are enforced against the known total. */
function goToPage(page) {
  const last = state.total === null ? state.page : Math.max(0, Math.ceil(state.total / PAGE_SIZE) - 1);
  const next = Math.min(Math.max(0, page), last);
  if (next === state.page) return;
  state.page = next;
  closeDrawer();
  loadRows();
}

// --- render ----------------------------------------------------------------

// Searching and sorting are both done by the service now - see loadRows. Doing
// them here would only ever have reordered the page in view, which reads as if
// it reordered the data.

function renderTabs() {
  document.getElementById('tabs').innerHTML = Object.entries(VIEWS).map(([key, view]) => {
    const count = state.counts[key];
    return `<a href="?view=${key}" data-view="${key}"${key === state.view ? ' class="active"' : ''}>`
      + `${Shell.esc(view.label)}${count !== undefined ? `<span class="count">${Shell.num(count)}</span>` : ''}</a>`;
  }).join('');
  document.querySelectorAll('.tabs a').forEach((a) => {
    a.addEventListener('click', (e) => { e.preventDefault(); switchView(a.dataset.view); });
  });
}

const KPI_FMT = {
  euro: (v) => Shell.euro(v),
  num1: (v) => Shell.num(v, 1),
  num2: (v) => Shell.num(v, 2),
};

/** The filter the KPIs are measured over: everything except paging. */
function baseFilter(view) {
  const filters = [];
  if (state.store) filters.push(`store_ID eq '${Shell.odata(state.store)}'`);
  if (view.state && state.status) filters.push(`state eq '${Shell.odata(state.status)}'`);
  const search = searchFilter(view, state.search);
  if (search) filters.push(search);
  return filters;
}

/**
 * Compute the KPI tiles on the service, over the whole filtered collection.
 *
 * These used to be reduced over whatever rows the browser happened to be
 * holding. Now that the table only holds one page that would understate every
 * total, but it was never right: a "value at risk" summed over the first 500 of
 * 842 alerts is a wrong number presented as a total, and nothing on screen said
 * so. OData $apply pushes the aggregation down to the database, so the tile
 * reports the collection rather than the page.
 */
async function renderKpis() {
  const view = VIEWS[state.view];
  const host = document.getElementById('kpis');
  const filters = baseFilter(view);
  const prefix = filters.length ? `filter(${filters.join(' and ')})/` : '';

  host.innerHTML = view.kpis.map((k) => `
    <div class="stat" style="--accent:${k.accent}">
      <div class="stat-label">${Shell.esc(k.label)}</div>
      <div class="stat-value"><span class="skeleton" style="display:inline-block;width:74px;height:1em"></span></div>
    </div>`).join('');

  // Sums, maxima and the plain count share one aggregate request; the others
  // each need their own shape of query.
  const scalar = view.kpis
    .map((k, i) => ({ k, i }))
    .filter(({ k }) => k.agg.sum || k.agg.max || k.agg.count);

  const values = new Array(view.kpis.length).fill(null);

  const requests = [];
  if (scalar.length) {
    const terms = scalar.map(({ k, i }) => (k.agg.count
      ? `$count as k${i}`
      : `${k.agg.sum || k.agg.max} with ${k.agg.sum ? 'sum' : 'max'} as k${i}`));
    requests.push(Shell.fetchJson(`${AI}/${view.entity}?$apply=${prefix}aggregate(${terms.join(',')})`)
      .then((rows) => {
        const row = Array.isArray(rows) ? rows[0] : rows;
        for (const { i } of scalar) values[i] = row ? row[`k${i}`] : null;
      }));
  }

  view.kpis.forEach((k, i) => {
    if (k.agg.distinct) {
      // groupby returns one row per distinct value, so its length is the count.
      requests.push(Shell.fetchJson(`${AI}/${view.entity}?$apply=${prefix}groupby((${k.agg.distinct}))`)
        .then((rows) => { values[i] = (rows || []).length; }));
    } else if (k.agg.countWhere) {
      const combined = [...filters, `(${k.agg.countWhere})`].join(' and ');
      requests.push(Shell.fetchJson(`${AI}/${view.entity}?$apply=filter(${combined})/aggregate($count as n)`)
        .then((rows) => {
          const row = Array.isArray(rows) ? rows[0] : rows;
          values[i] = row ? row.n : null;
        }));
    }
  });

  // One failing tile must not blank the row, so each is settled on its own and
  // an unavailable figure is shown as such rather than as zero.
  await Promise.allSettled(requests);
  if (state.view !== view.entity && VIEWS[state.view] !== view) return; // view changed mid-flight

  host.innerHTML = view.kpis.map((k, i) => {
    // An aggregate over an empty set comes back null. When the filter genuinely
    // matched nothing that is a zero, not an unknown - only show a dash when
    // the figure could not be obtained.
    const value = values[i] === null && state.total === 0 ? 0 : values[i];
    const text = value === null || value === undefined
      ? '—'
      : (KPI_FMT[k.fmt] || Shell.num)(value);
    return `<div class="stat" style="--accent:${k.accent}">
      <div class="stat-label">${Shell.esc(k.label)}</div>
      <div class="stat-value">${text}</div>
    </div>`;
  }).join('');
}

function renderTable() {
  const view = VIEWS[state.view];
  const rows = state.rows;
  const host = document.getElementById('tableHost');

  const from = state.page * PAGE_SIZE + 1;
  const to = state.page * PAGE_SIZE + rows.length;
  document.getElementById('rowCount').textContent = state.total === null
    ? `${Shell.num(rows.length)} row${rows.length === 1 ? '' : 's'}`
    : `${Shell.num(state.total ? from : 0)}–${Shell.num(to)} of ${Shell.num(state.total)} row${state.total === 1 ? '' : 's'}`;

  if (!rows.length) {
    host.innerHTML = `<div class="state"><strong>Nothing matches the current filters.</strong>`
      + `${state.status ? 'Try setting status to “Any status”.' : 'Try clearing the search box.'}</div>`;
    return;
  }

  const head = view.columns.map((c) => {
    const active = state.sortKey === c.key;
    const arrow = active ? `<span class="arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th data-key="${Shell.esc(c.key)}" class="sortable ${NUMERIC.has(c.fmt) ? 'num' : ''}">${Shell.esc(c.label)}${arrow}</th>`;
  }).join('');

  const body = rows.map((row, index) => `<tr data-index="${index}">${view.columns.map((c) => {
    const cls = [NUMERIC.has(c.fmt) ? 'num' : '', c.fmt === 'wrap' ? 'wrap' : '', c.strong ? 'strong' : ''].filter(Boolean).join(' ');
    return `<td class="${cls}">${(FMT[c.fmt] || FMT.text)(pick(row, c.key))}</td>`;
  }).join('')}</tr>`).join('');

  host.innerHTML = `<div class="table-wrap"><table class="data rows-clickable">`
    + `<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`
    + renderPager();

  host.querySelectorAll('th.sortable').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'asc'; }
      // Re-sorting is a new query: the row that belongs at the top may well be
      // on a page that is not loaded.
      state.page = 0;
      loadRows();
    });
  });
  host.querySelectorAll('[data-page]').forEach((button) => {
    button.addEventListener('click', () => goToPage(Number(button.dataset.page)));
  });
  host.querySelectorAll('tbody tr').forEach((tr) => {
    tr.addEventListener('click', () => openDrawer(rows[Number(tr.dataset.index)], tr));
  });
}

/** Page controls. Rendered only when there is more than one page to move to. */
function renderPager() {
  if (state.total === null) return '';
  const pages = Math.ceil(state.total / PAGE_SIZE);
  if (pages <= 1) return '';
  const first = state.page === 0;
  const last = state.page >= pages - 1;
  return `<div class="pager">
    <button class="btn" data-page="${state.page - 1}"${first ? ' disabled' : ''}>Previous</button>
    <span class="pager-label">Page ${Shell.num(state.page + 1)} of ${Shell.num(pages)}</span>
    <button class="btn" data-page="${state.page + 1}"${last ? ' disabled' : ''}>Next</button>
  </div>`;
}

const LABELS = {
  'store.name': 'Store', 'article.name': 'Article', 'posSystem.name': 'Terminal',
  'posSystem.kind': 'Terminal type', 'supplier.name': 'Supplier',
  'supplier.leadTimeDays': 'Lead time (days)', 'supplier.reliability': 'Supplier reliability',
  'antecedent.name': 'If basket has', 'consequent.name': 'Also buys',
  'customer.displayName': 'Customer', 'customer.loyaltyTier': 'Loyalty tier', 'customer.segment': 'Segment',
};
const labelFor = (key) => LABELS[key]
  || key.replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase()).replace(/Pct$/, ' %').trim();

function formatDetail(view, key, value) {
  const column = view.columns.find((c) => c.key === key);
  if (column) return (FMT[column.fmt] || FMT.text)(value);
  if (typeof value === 'boolean') return FMT.bool(value);
  if (/At$|On$|From$|To$/.test(key) && typeof value === 'string' && value.includes('-')) {
    return value.includes('T') ? dt(value) : dateOnly(value);
  }
  if (typeof value === 'number') return Shell.num(value, Number.isInteger(value) ? 0 : 3);
  return Shell.esc(value ?? '—');
}

function openDrawer(row, tr) {
  const view = VIEWS[state.view];
  document.querySelectorAll('tbody tr.selected').forEach((el) => el.classList.remove('selected'));
  if (tr) tr.classList.add('selected');

  document.getElementById('drawerTitle').textContent = pick(row, 'article.name') || row.assetName
    || row.title || pick(row, 'antecedent.name') || pick(row, 'customer.displayName') || row.ID;

  // Evidence first: it is what you need to judge whether to act.
  const prose = view.prose.filter((k) => row[k]).map((k) => `
    <div class="field prose">
      <div class="field-label">${Shell.esc(labelFor(k))}</div>
      <div class="field-value">${Shell.esc(row[k])}</div>
    </div>`).join('');
  const fields = view.detail.map((k) => `
    <div class="field">
      <div class="field-label">${Shell.esc(labelFor(k))}</div>
      <div class="field-value">${formatDetail(view, k, pick(row, k))}</div>
    </div>`).join('');

  document.getElementById('drawerBody').innerHTML = prose + fields
    + `<div class="field"><div class="field-label">Record</div><div class="field-value mono">${Shell.esc(row.ID)}</div></div>`;

  const canAct = !view.state || row.state === 'OPEN';
  document.getElementById('drawerActions').innerHTML = canAct
    ? view.actions.map((a, i) => `<button class="btn${i === 0 ? ' btn-primary' : ''}" data-action="${Shell.esc(a.id)}">${Shell.esc(a.label)}</button>`).join('')
    : (view.actions.length ? `<span class="field-label" style="margin:0">Already ${Shell.esc(String(row.state).toLowerCase())}</span>` : '');

  document.getElementById('drawerActions').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => runAction(b.dataset.action, row, b));
  });

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('on');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('on');
  document.querySelectorAll('tbody tr.selected').forEach((el) => el.classList.remove('selected'));
}

async function runAction(actionId, row, button) {
  const view = VIEWS[state.view];
  const action = view.actions.find((a) => a.id === actionId);
  if (!action) return;
  const payload = {};
  if (action.arg) payload[action.arg] = action.fromField ? Number(row[action.fromField]) : action.value;

  button.disabled = true;
  const original = button.textContent;
  button.textContent = 'Working…';
  try {
    await Shell.fetchJson(`${AI}/${view.entity}('${encodeURIComponent(row.ID)}')/AIService.${actionId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    Shell.toast(`${action.label} applied to ${row.ID}`);
    closeDrawer();
    await loadRows();
  } catch (error) {
    Shell.toast(`Failed: ${error.message}`);
    button.disabled = false;
    button.textContent = original;
  }
}

// --- navigation ------------------------------------------------------------

function switchView(key) {
  state.view = VIEWS[key] ? key : Object.keys(VIEWS)[0];
  state.sortKey = null;
  state.search = '';
  state.page = 0;
  state.total = null;
  document.getElementById('search').value = '';
  closeDrawer();

  const view = VIEWS[state.view];
  document.title = `${view.title} — S.Mart Retail AI`;
  document.getElementById('viewTitle').textContent = view.title;
  document.getElementById('viewDesc').textContent = view.desc;
  document.getElementById('stateFilter').disabled = !view.state;

  history.replaceState(null, '', `?view=${state.view}`);
  renderTabs();
  loadRows();
}

// Any change to the query starts again at the first page - staying on page 4 of
// a result set that no longer has four pages would show an empty table.
document.getElementById('storeFilter').addEventListener('change', (e) => {
  state.store = e.target.value; state.page = 0; loadRows();
});
document.getElementById('stateFilter').addEventListener('change', (e) => {
  state.status = e.target.value; state.page = 0; loadRows();
});
// Searching hits the service now, so wait for a pause in typing rather than
// issuing a request per keystroke.
document.getElementById('search').addEventListener('input', (e) => {
  state.search = e.target.value;
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(() => { state.page = 0; loadRows(); }, 250);
});
document.getElementById('reload').addEventListener('click', () => loadRows());
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

(async function start() {
  const requested = new URLSearchParams(location.search).get('view');
  state.view = VIEWS[requested] ? requested : Object.keys(VIEWS)[0];
  renderTabs();
  try { await loadStores(); } catch { /* loadRows reports authentication failures */ }
  switchView(state.view);
})();
</script>
